server:
  port: 8090

spring:
  application:
    name: flowable

  datasource:
    url: jdbc:postgresql://localhost:5433/flowable?characterEncoding=UTF-8
    username: flowable
    password: flowable
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        hbm2ddl:
          create_namespace: true
        default_schema: flowable
    database-platform: org.hibernate.dialect.PostgreSQLDialect

flowable:
  database-schema-update: true
  async-executor-activate: true
  tenants: SL